<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — The Perfect Parenting Company</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div data-include="/partials/header.html"></div>

<section class="section" style="padding-top:48px;">
  <div class="wrap" style="max-width:820px;">
    <div id="registry-header">
      <span class="eyebrow">Gifting</span>
      <h1 id="reg-title">Loading…</h1>
      <p id="reg-note"></p>
    </div>

    <div id="items" style="margin-top:28px;"></div>
  </div>
</section>

<div id="reserve-modal" style="display:none;position:fixed;inset:0;background:rgba(35,36,31,0.5);z-index:200;align-items:center;justify-content:center;padding:20px;">
  <div class="form-card" style="max-width:420px;width:100%;">
    <h3>Reserve this gift</h3>
    <p id="reserve-item-title" style="font-weight:600;color:var(--ink);"></p>
    <div class="field">
      <label for="guest_name">Your name *</label>
      <input id="guest_name" required>
    </div>
    <div class="field">
      <label for="guest_email">Your email (optional)</label>
      <input id="guest_email" type="email">
    </div>
    <div class="field">
      <label for="guest_message">A note for the parents (optional)</label>
      <textarea id="guest_message" rows="2"></textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" type="button" id="cancel-reserve" style="flex:1;justify-content:center;">Cancel</button>
      <button class="btn btn-primary" type="button" id="confirm-reserve" style="flex:1;justify-content:center;">Confirm</button>
    </div>
  </div>
</div>

<div data-include="/partials/footer.html"></div>
<script src="/assets/include.js"></script>
<script src="/assets/pages/registry-view.js"></script>

</body>
</html>
