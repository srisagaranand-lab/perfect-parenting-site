<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Registry | The Perfect Parenting Co.</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div data-include="/partials/header.html"></div>

<section class="section-tight">
  <div class="wrap" style="max-width:560px;">
    <span class="eyebrow">Create your registry</span>
    <h1>Let's set up your list</h1>
    <div class="form-card">
      <div class="field">
        <label for="parentName">Your name</label>
        <input id="parentName" placeholder="e.g. Sagar Shah">
      </div>
      <div class="field">
        <label for="partnerName">Partner's name (optional)</label>
        <input id="partnerName" placeholder="e.g. Meera Shah">
      </div>
      <div class="field">
        <label for="babyName">Baby's name or nickname (optional)</label>
        <input id="babyName" placeholder="e.g. Baby Aanya">
      </div>
      <div class="field">
        <label for="dueDate">Due date</label>
        <input id="dueDate" type="date">
      </div>
      <div class="field">
        <label for="city">City</label>
        <input id="city" placeholder="e.g. Mumbai">
      </div>
      <div class="field">
        <label for="slug">Vanity link</label>
        <div class="vanity-preview">
          <span>theperfectparenting.in/gift/</span>
          <input id="slug" placeholder="aanya-arrives">
        </div>
      </div>
      <button class="btn btn-marigold" style="width:100%;justify-content:center;" onclick="createRegistry()">Create registry</button>
    </div>
  </div>
</section>

<div data-include="/partials/footer.html"></div>
<script src="/assets/include.js"></script>
<script>
async function createRegistry() {
  const payload = {
    parent_name: document.getElementById('parentName').value.trim(),
    partner_name: document.getElementById('partnerName').value.trim() || null,
    baby_name: document.getElementById('babyName').value.trim() || null,
    due_date: document.getElementById('dueDate').value || null,
    city: document.getElementById('city').value.trim() || null,
    slug: document.getElementById('slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-'),
  };
  if (!payload.parent_name || !payload.slug) {
    showToast('Add your name and a vanity link to continue');
    return;
  }
  try {
    const res = await fetch('/api/registries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('request failed');
    showToast('Registry created — redirecting…');
    setTimeout(() => location.href = '/gifting.html#vanity-url', 1000);
  } catch (e) {
    // Backend function not connected in this preview — proceed to the next step anyway.
    showToast('Saved locally — connect /api/registries to persist this');
    setTimeout(() => location.href = '/gifting.html#vanity-url', 1000);
  }
}
</script>
</body>
</html>
